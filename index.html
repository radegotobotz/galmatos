    <style type="text/css">
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font: 12px/1.5 "Roboto", Arial, "Microsoft YaHei", sans-serif;
      }

      body {
        color: #404349;
        font: 12px/1.5 "Roboto", Arial, "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #f0f1f2;
      }

      body,
      html {
        height: 100%;
        margin: 0;
        font-size: 14px;
      }

      a {
        text-decoration: none;
      }

      a:active {
        color: #2d6bb3;
      }

      a:hover {
        color: #6aace6;
      }

      #frame {
        width: 100%;
        height: auto;
        padding: 20px;
        float: left;
        position: relative;
        font-size: 14px;
        color: #444;
        clear: both;
        z-index: 10;
        //box-shadow:0px 1px 2px #777;
      }

      #inner-frame {
        max-width: 800px;
        width: 100%;
        height: auto;
        margin: auto;
        padding: 10px;
        position: relative;
        overflow-x: hidden;
      }

      input:-internal-autofill-selected {
        background-color: transparent;
      }

      .errorfound {
        border: 2px solid #d00;
        box-shadow: 0px 0px 1px #d00;
        color: #d00;
      }

      #loader {
        display: none;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: #fff9;
        z-index: 99;
        border-radius: 10px;
      }

      @keyframes hideLoader {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }

      @keyframes showLoader {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .formImgHolder {
        display: grid;
        grid-template-columns: 50% 50%;
        background-color: #fff;
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.1);
      }

        padding: 30px;

        cursor: pointer;
      }

        background-color: #d53434;
      }

      let loader = document.querySelector("#loader");
      let loc = document.querySelector("#loc");

      if (xx[1] != undefined) {

        let options = {
          method: "POST",

          options
        );

        loader.style.animation = "hideLoader 1s ease";

        }, 1000);
